name: Sync to Hugging Face Space

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-lfs
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: freddy-jmdataai
          SPACE_NAME: moonsign
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          mkdir /tmp/hf_deploy
          rsync -a --exclude .git --exclude .github ./ /tmp/hf_deploy/

          cd /tmp/hf_deploy
          git init
          git lfs install

          # Track all binary file types via LFS
          git lfs track "*.png"
          git lfs track "*.jpg"
          git lfs track "*.jpeg"
          git lfs track "*.gif"
          git lfs track "*.se1"

          # .gitattributes must be committed first before binary files
          git add .gitattributes
          git commit -m "chore: add git-lfs tracking"

          git checkout -b main
          git add .
          git commit -m "deploy: $(date +'%Y-%m-%d %H:%M:%S') — ${{ github.sha }}"

          git remote add hfspace https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME
          git push hfspace main --force
