name: Sync to Hugging Face Space

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # ✏️ Replace these two values with your actual HF username and Space name
          HF_USERNAME: freddy-jmdataai
          SPACE_NAME: moonsign
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          mkdir /tmp/hf_deploy
          rsync -a --exclude .git --exclude .github ./ /tmp/hf_deploy/

          cd /tmp/hf_deploy
          git init
          git checkout -b main
          git add .
          git commit -m "deploy: $(date +'%Y-%m-%d %H:%M:%S') — ${{ github.sha }}"

          git remote add hfspace https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME
          git push hfspace main --force